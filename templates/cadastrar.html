<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar produto - PCM</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <main class="container">
        <a href="{{ url_for('inicio') }}">
            ← Voltar para produtos
        </a>

        <section class="form-card">
    {% set editando = produto is defined %}

    <h1>
        {{ "Editar produto" if editando else "Cadastrar produto" }}
    </h1>

    <p>
        {{ "Atualize as informações do produto."
           if editando
           else "Preencha as informações do novo produto." }}
    </p>

    <form method="POST">
        <label>
            Nome do produto
            <input
                type="text"
                name="nome"
                value="{{ produto['nome'] if editando else '' }}"
                required
            >
        </label>

        <label>
            Categoria
            <input
                type="text"
                name="categoria"
                value="{{ produto['categoria'] if editando else '' }}"
                required
            >
        </label>

        <label>
            SKU
            <input
                type="text"
                name="sku"
                value="{{ produto['sku'] if editando else '' }}"
                required
            >
        </label>

        <label>
            Possui variações?

            <select name="possui_variacao">
                <option
                    value="nao"
                    {% if not (produto is defined and produto["possui_variacao"]) %}
                        selected
                    {% endif %}
                >
                    Não
                </option>

                <option
                    value="sim"
                    {% if produto is defined and produto["possui_variacao"] %}
                        selected
                    {% endif %}
                >
                    Sim
                </option>
            </select>
        </label>

        <label>
            Variações
            <input
                type="text"
                name="variacoes"
                value="{% if editando %}{{ produto['variacoes'] | join(', ') }}{% endif %}"
                placeholder="Roxo, Azul"
            >
        </label>

        <label>
            Estoque por variação
            <input
                type="text"
                name="estoques_variacoes"
                value="{% if editando %}{% for variacao in produto['variacoes'] %}{{ variacao }}:{{ produto['estoques_variacoes'].get(variacao, 0) }}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}"
                placeholder="Roxo:20, Azul:30"
            >
        </label>

        <label>
            Preço de custo
            <input
                type="number"
                name="preco_custo"
                value="{{ produto['preco_custo'] if editando else '' }}"
                step="0.01"
                min="0"
                required
            >
        </label>

        <label>
            Preço de venda
            <input
                type="number"
                name="preco_venda"
                value="{{ produto['preco_venda'] if editando else '' }}"
                step="0.01"
                min="0"
                required
            >
        </label>

        <label>
            Estoque
            <input
                type="number"
                name="estoque"
                value="{{ produto['estoque'] if editando else '' }}"
                min="0"
            >
        </label>

        <button
            class="button-primary"
            type="submit"
        >
            {{ "Salvar alterações" if editando else "Salvar produto" }}
        </button>
    </form>
</section>
